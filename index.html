<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atrapar Limones</title>
  <link rel="stylesheet" href="limones.css">
  <script src="utils.js"></script>
</head>

<body onload="dibujarIniciar()">
  <div class="contenedor">
    <header class="encabezado">
      <div class="icono">🍋</div>
      <div>
        <h1>Atrapar Limones</h1>
        <p>Si del cielo te caen limones, ¡a hacer limonada aprendes!</p>
      </div>
    </header>

    <h2>Autor: Yessenia Quinatoa</h2>

    <section class="zona-juego">
      <div class="etiqueta-juego">🍋 ¡Atrapa los limones! 🍋</div>
      <canvas id="areaJuego" width="600" height="400"></canvas>
    </section>

    <div class="panel">
      <div class="marcador">
        <span class="marcador-icono">🏆</span>
        <div>
          <span class="marcador-titulo">Puntaje</span>
          <span id="txtPuntaje">0</span>
        </div>
      </div>

      <div class="separador"></div>

      <div class="marcador">
        <span class="marcador-icono">❤️</span>
        <div>
          <span class="marcador-titulo">Vidas</span>
          <span id="txtVidas">3</span>
        </div>
      </div>
    </div>

    <div class="botones">
      <button type="button" onclick="moverIzquierda();" class="btn btn-mover">
        ◀ Izquierda
      </button>
      <button type="button" onclick="moverDerecha();" class="btn btn-mover">
        Derecha ▶
      </button>
      <button type="button" onclick="reiniciar();" class="btn btn-reiniciar">
        ↻ Reiniciar
      </button>
    </div>

    <footer>🍋 ¡Buena suerte y atrapa todos los limones! 🍋</footer>
  </div>

  <script src="limones.js"></script>
</body>
</html>
