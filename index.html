<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atrapar Limones - Aventura</title>
  <link rel="stylesheet" href="limones.css">
  <script src="utils.js"></script>
</head>

<body onload="dibujarIniciar()">
  <div class="fondo-circulo circulo-1"></div>
  <div class="fondo-circulo circulo-2"></div>

  <div class="contenedor">
    <div class="imagen-superior">
      <img src="sinsajo.png" alt="Ave azul">
    </div>

    <header class="encabezado">
      <div class="insignia">★</div>

      <div>
        <div class="tipo-juego">⚡ AVENTURA DE LIMONES ⚡</div>
        <h1>ATRAPAR LIMONES</h1>
        <p>¡Atrapa todos los limones y conviértete en el campeón!</p>
      </div>
    </header>

    <div class="tarjeta-entrenador">
      <span>🎒 ENTRENADOR</span>
      <strong>Yessenia Quinatoa</strong>
      <span class="aventura">⚡ COMIENZA LA AVENTURA ⚡</span>
    </div>

    <section class="zona-juego">
      <canvas id="areaJuego" width="600" height="400"></canvas>
    </section>

    <div class="panel">
      <div class="marcador">
        <div class="icono-marcador">🏆</div>
        <div>
          <span class="marcador-titulo">PUNTOS</span>
          <span id="txtPuntaje">0</span>
        </div>
      </div>

      <div class="separador"></div>

      <div class="marcador">
        <div class="icono-marcador">❤️</div>
        <div>
          <span class="marcador-titulo">VIDAS</span>
          <span id="txtVidas">3</span>
        </div>
      </div>
    </div>

    <div class="botones">
      <button type="button" onclick="moverIzquierda();" class="btn btn-mover">
        ◀ IZQUIERDA
      </button>

      <button type="button" onclick="moverDerecha();" class="btn btn-mover">
        DERECHA ▶
      </button>

      <button type="button" onclick="reiniciar();" class="btn btn-reiniciar">
        ↻ NUEVA PARTIDA
      </button>
    </div>

    <footer>
      ⚡ ¡Atrapa, consigue puntos y completa tu aventura! ⚡
    </footer>
  </div>

  <script src="limones.js"></script>
</body>
</html>
